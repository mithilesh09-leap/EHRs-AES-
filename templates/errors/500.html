{% extends "base.html" %}

{% block title %}500 Internal Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="ehr-card p-5">
                <div class="text-warning mb-4">
                    <i class="fa-solid fa-triangle-exclamation fa-5x"></i>
                </div>
                <h1 class="display-6 fw-bold text-navy mb-3">500 - Server Error</h1>
                <p class="text-muted mb-4">
                    An unexpected internal exception occurred while processing your request. 
                    Cryptographic integrity and database rollbacks have been safely enforced.
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-primary-ehr">
                    <i class="fa-solid fa-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
