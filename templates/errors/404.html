{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="ehr-card p-5">
                <div class="text-primary mb-4">
                    <i class="fa-solid fa-file-circle-question fa-5x"></i>
                </div>
                <h1 class="display-6 fw-bold text-navy mb-3">404 - Record Not Found</h1>
                <p class="text-muted mb-4">
                    The requested medical record, document, or route does not exist or has been relocated.
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-primary-ehr">
                    <i class="fa-solid fa-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
