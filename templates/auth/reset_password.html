{% extends "base.html" %}

{% block title %}Reset Password - EHR Guardian{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5 col-lg-4">
        <div class="ehr-card shadow-sm">
            <div class="ehr-card-body p-4">
                <div class="text-center mb-4">
                    <span class="brand-icon mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <h3 class="fw-bold mt-2 mb-1">Password Recovery</h3>
                    <p class="text-muted small">Enter your email to receive recovery instructions</p>
                </div>

                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Account Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="user@hospital.org" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-ehr w-100 py-2 mb-3">
                        <i class="fa-solid fa-paper-plane me-1"></i> Send Instructions
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Remember your credentials? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Return to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
